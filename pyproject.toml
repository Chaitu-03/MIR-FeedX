[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mir-feedx"
version = "0.1.0"
description = "Media Information Retrieval system for Tumblr feed indexing and search"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Vector store
    "qdrant-client[grpc]>=1.9.0",
    "pgvector>=0.3.0",

    # Task queue / cache
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",

    # ML / embeddings
    "sentence-transformers>=3.0.0",
    "open-clip-torch>=2.24.0",
    "torch>=2.3.0",

    # Content processing
    "aiohttp>=3.9.0",
    "bleach>=6.1.0",
    "html2text>=2024.2.26",
    "imagehash>=4.3.1",

    # Language detection
    "fasttext-wheel>=0.9.2",

    # ML utilities
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.33",

    # Security / auth
    "bcrypt>=4.1.0",

    # Observability
    "structlog>=24.1.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers>=4.5.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mir"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning:mir.*"]
markers = [
    "slow: integration tests that load real ML models (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
